[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "hatsim"
version = "0.1.0"
description = "Lightweight heterogeneous robot task servicing simulator with record and replay"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "PyYAML>=6.0", "matplotlib>=3.6"]
[project.optional-dependencies]
test = ["pytest>=7"]
marl = ["pettingzoo>=1.24", "gymnasium>=0.29"]
gui = ["pyvista>=0.43", "PySide6>=6.5", "pyvistaqt>=0.11"]
[project.scripts]
hatsim = "hatsim.cli:main"
[tool.setuptools.packages.find]
include = ["hatsim*", "policies*"]
